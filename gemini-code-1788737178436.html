<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auto-Connect Video Chat</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }
    #status {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(0, 0, 0, 0.65);
      color: #00e676;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.95rem;
      pointer-events: none;
      backdrop-filter: blur(4px);
      text-align: center;
    }
    .video-container {
      display: flex;
      width: 100vw;
      height: 100vh;
    }
    .video-wrapper {
      position: relative;
      flex: 1;
      height: 100%;
      background: #111;
      border-right: 1px solid #222;
    }
    .video-wrapper:last-child {
      border-right: none;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #localVideo {
      transform: scaleX(-1);
    }
    .label {
      position: absolute;
      bottom: 15px;
      left: 15px;
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      pointer-events: none;
    }

    @media (max-width: 768px) {
      .video-container {
        flex-direction: column;
      }
      .video-wrapper {
        border-right: none;
        border-bottom: 1px solid #222;
      }
    }
  </style>
</head>
<body>

  <div id="status">Starting camera...</div>

  <div class="video-container">
    <div class="video-wrapper">
      <video id="localVideo" autoplay playsinline muted></video>
      <div class="label">You</div>
    </div>
    <div class="video-wrapper">
      <video id="remoteVideo" autoplay playsinline></video>
      <div class="label">Friend</div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, push, onValue, onChildAdded, onDisconnect } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCInXuRZc6ZKm14qUwohSD9eHDu1jYe3jg",
      authDomain: "webcam-19002.firebaseapp.com",
      databaseURL: "https://webcam-19002-default-rtdb.firebaseio.com",
      projectId: "webcam-19002",
      storageBucket: "webcam-19002.firebasestorage.app",
      messagingSenderId: "333469708016",
      appId: "1:333469708016:web:4482ecd23295b770081c35"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const servers = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };
    let peerConnection;
    let localStream;

    const statusText = document.getElementById("status");
    const localVideo = document.getElementById("localVideo");
    const remoteVideo = document.getElementById("remoteVideo");

    async function start() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        localVideo.srcObject = localStream;
        statusText.innerText = "Searching for friend...";

        const channelRef = ref(db, "active_call");

        onValue(channelRef, async (snapshot) => {
          const data = snapshot.val();

          if (!data && !peerConnection) {
            setupHost(channelRef);
          } else if (data && data.offer && !data.answer && !peerConnection) {
            setupGuest(channelRef, data.offer);
          }
        }, { onlyOnce: true });

      } catch (error) {
        statusText.innerText = "Camera access denied or unavailable.";
        console.error(error);
      }
    }

    async function setupHost(channelRef) {
      statusText.innerText = "Waiting for friend to open page...";
      onDisconnect(channelRef).remove();

      peerConnection = new RTCPeerConnection(servers);
      localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

      peerConnection.ontrack = (e) => { remoteVideo.srcObject = e.streams[0]; };

      peerConnection.onicecandidate = (e) => {
        if (e.candidate) {
          push(ref(db, "active_call/hostCandidates"), e.candidate.toJSON());
        }
      };

      const offer = await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);

      await set(channelRef, { offer: { type: offer.type, sdp: offer.sdp } });

      onValue(ref(db, "active_call/answer"), async (snapshot) => {
        const answer = snapshot.val();
        if (answer && !peerConnection.currentRemoteDescription) {
          await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
          statusText.innerText = "Connected";
        }
      });

      onChildAdded(ref(db, "active_call/guestCandidates"), (snapshot) => {
        peerConnection.addIceCandidate(new RTCIceCandidate(snapshot.val()));
      });
    }

    async function setupGuest(channelRef, offer) {
      statusText.innerText = "Connecting...";

      peerConnection = new RTCPeerConnection(servers);
      localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

      peerConnection.ontrack = (e) => { remoteVideo.srcObject = e.streams[0]; };

      peerConnection.onicecandidate = (e) => {
        if (e.candidate) {
          push(ref(db, "active_call/guestCandidates"), e.candidate.toJSON());
        }
      };

      await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));

      const answer = await peerConnection.createAnswer();
      await peerConnection.setLocalDescription(answer);

      await set(ref(db, "active_call/answer"), { type: answer.type, sdp: answer.sdp });

      onChildAdded(ref(db, "active_call/hostCandidates"), (snapshot) => {
        peerConnection.addIceCandidate(new RTCIceCandidate(snapshot.val()));
      });

      statusText.innerText = "Connected";
    }

    start();
  </script>
</body>
</html>
